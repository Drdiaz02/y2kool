<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="matrix_style.css">
        <title>Y2Kool</title>
    </head>
        <body>
            <!--Overlay-->
            <div id="Intro" class="Overlay">
                <div class="terminal">
                    <pre id="matrix-text"></pre>
                    
                    <div class="welcome-container">
                        <p class="welcome-message">press enter</p>
                        <button id="enter-button" class="enter-button">Enter</button>
                    </div>
                </div>
            </div>
            <main>
                <!--Main-->
                <h2>Welcome to the main site</h2>
                <p>All y2k chaos lives here.</p>
            </main>

            <script>
                const Overlay = document.getElementById('Intro');
                const enterBtn = document.getElementById('enter-button');
                const matrixText = document.getElementById('matrix-text');
                // add some consts for text animations
                const typeSpeed = 100;
                const pauseAfterLine = 800;
                const nextLineDelay= 200;

                const introLines = [
                    "booting y2kool.exe...",
                    "initializing retro systems...",
                    "establishing connection...",
                    "decrypting archives...",
                    "loading nostalgia protocols...",
                    "",
                    "welcome to y2kool..."
                ];

                let lineIndex = 0;
                let charIndex = 0;

                function typeLine() {
                    if (lineIndex < introLines.length) {
                        let currentLine = introLines[lineIndex];

                        // type 1 character
                        matrixText.textContent += currentLine[charIndex] ?? ""; // types undefined without the ternary

                        charIndex++;

                        
                    // End of line move to next line
                    if (charIndex > currentLine.length) {

                        setTimeout(() => {
                            matrixText.textContent = "";
                            lineIndex++;
                            charIndex = 0;

                            setTimeout(typeLine, nextLineDelay);

                        }, pauseAfterLine); // this is where line on screen is controlled

                        } else {
                            setTimeout(typeLine, typeSpeed); // Delay between characters
                        }
                    }
                }

                // start type effect when overlay loads
                window.addEventListener('load', typeLine);

                enterBtn.addEventListener('click', () => {
                    Overlay.classList.add('hidden');
                });
            </script>
        </body>
</html>
